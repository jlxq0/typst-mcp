name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # All cargo checks in one job. On a fast runner the cache hit + shared
  # incremental state crushes the GHA-style "one job per check" pattern.
  cargo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }
      # Cross-repository drift is checked on trusted pushes. Pull requests do not
      # receive this read token; main cannot become a release tag until this check runs.
      - name: Checkout canonical OfficeMaster templates
        if: github.event_name != 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: thehansogroup/OfficeMaster
          ref: feat/ksc-typst-template
          path: .upstream/OfficeMaster
          token: ${{ secrets.FORGE_PUSH_TOKEN }}
          persist-credentials: false
      - name: Check vendored template drift
        if: github.event_name != 'pull_request'
        env:
          OFFICEMASTER_DIR: ${{ github.workspace }}/.upstream/OfficeMaster
        run: scripts/sync-templates.sh --check
      - name: Verify bundled font checksums and licences
        run: scripts/fetch-fonts.sh --verify-only
      # Pin a commit on master, not on `stable`. Forge resolves actions from its
      # own mirrors (DEFAULT_ACTIONS_URL = forge.oddie.app), and dtolnay
      # force-pushes `stable`, so the mirror's 24h sync prunes the old tip and
      # the pin 404s. master/v1 is append-only. It has no default `toolchain`.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --all-features --locked
      - name: audit
        run: |
          [ -x ~/.cargo/bin/cargo-audit ] || cargo install --locked cargo-audit
          cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1  # v2
        with: { command: check bans licenses sources }

  # buildctl talks to Pada's buildkitd over TCP. Registry-backed layer cache
  # so a rebuild reuses unchanged layers across runs.
  docker:
    runs-on: ubuntu-22.04
    # The Fondue runner talks to its DinD sidecar over mutual TLS. Job
    # containers live inside that daemon, so mount its client certificate set
    # explicitly; `docker_host: automount` only covers Unix-socket runners.
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
      volumes:
        - /certs/client:/certs/client:ro
        # Public server certificate only: select its issued pod-IP SAN without
        # exposing the DinD server private key to workflow code.
        - /certs/server/cert.pem:/certs/server-cert.pem:ro
    needs: cargo
    # Build and smoke on every ref. A tag is only another name for the exact local
    # image that passed this job; no second build occurs after the smoke gate.
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }
      - name: Install buildctl
        env:
          BUILDKIT_VERSION: v0.30.0
          # sha256 of buildkit-v0.30.0.linux-amd64.tar.gz from
          # github.com/moby/buildkit/releases/tag/v0.30.0
          BUILDKIT_SHA256: 2da148c50540409988c837e62b72176e4a9ad7855548a2dd6ea1cd0c0d2d360d
        run: |
          set -euo pipefail
          TARBALL="/tmp/buildkit.tar.gz"
          curl -sSL -o "$TARBALL" \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          echo "${BUILDKIT_SHA256}  $TARBALL" | sha256sum -c -
          sudo tar -xz -C /usr/local --strip-components=0 -f "$TARBALL"
          rm -f "$TARBALL"
          buildctl --version
      # Forgejo login only on trusted refs. Pull requests build cold: no package-write
      # credential or writable registry cache is exposed to untrusted code.
      - name: Login to Forgejo registry
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.docker
          F_AUTH=$(printf "%s:%s" "jlxq0" "${{ secrets.FORGE_PUSH_TOKEN }}" | base64 -w0)
          echo "{\"auths\":{\"forge.oddie.app\":{\"auth\":\"$F_AUTH\"}}}" > ~/.docker/config.json
      - name: Build exact local image
        run: |
          set -euo pipefail
          # buildkitd runs on the runner host; from inside this job container the
          # host is our own bridge gateway. Never hardcode it (changes on
          # reboot/DHCP, differs per repo/run). Slim image has no `ip`, so read
          # the default route from /proc/net/route via node (always present).
          GW="$(node -e 'const fs=require("fs");for(const l of fs.readFileSync("/proc/net/route","utf8").split("\n").slice(1)){const f=l.trim().split(/\s+/);if(f[1]==="00000000"){const h=f[2];console.log([h.slice(6,8),h.slice(4,6),h.slice(2,4),h.slice(0,2)].map(x=>parseInt(x,16)).join("."));break;}}')"
          DOCKER_IP="$(openssl x509 -in /certs/server-cert.pem -noout -ext subjectAltName \
            | tr ',' '\n' | sed -n 's/.*IP Address:\(10\.[0-9.]*\).*/\1/p' | head -1)"
          test -n "$DOCKER_IP"
          export BUILDKIT_HOST="tcp://${GW}:1234"
          export DOCKER_HOST="tcp://${DOCKER_IP}:2376"
          export DOCKER_CERT_PATH=/certs/client
          export DOCKER_TLS_VERIFY=1
          {
            echo "DOCKER_HOST=${DOCKER_HOST}"
            echo "DOCKER_CERT_PATH=${DOCKER_CERT_PATH}"
            echo "DOCKER_TLS_VERIFY=${DOCKER_TLS_VERIFY}"
          } >>"${GITHUB_ENV}"
          echo "buildkitd at ${BUILDKIT_HOST}"
          docker info --format 'docker server {{.ServerVersion}}'
          CACHE_REF="forge.oddie.app/jlxq0/typst-mcp:buildcache"
          IMPORT_CACHE_ARG=()
          EXPORT_CACHE_ARG=()
          if [[ "${GITHUB_EVENT_NAME}" != pull_request ]]; then
            IMPORT_CACHE_ARG=(--import-cache "type=registry,ref=${CACHE_REF}")
            EXPORT_CACHE_ARG=(--export-cache "type=registry,ref=${CACHE_REF},mode=max")
          fi
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            "${IMPORT_CACHE_ARG[@]}" \
            "${EXPORT_CACHE_ARG[@]}" \
            --output type=docker,name=typst-mcp:ci,dest=/tmp/typst-mcp-image.tar
          docker load --input /tmp/typst-mcp-image.tar
          docker image inspect typst-mcp:ci --format '{{.Id}}'
      - name: Start disposable smoke stack
        run: |
          set -euo pipefail
          STACK_ID="${GITHUB_RUN_ID:-run}-${GITHUB_RUN_ATTEMPT:-1}"
          NETWORK="typst-mcp-smoke-${STACK_ID}"
          APP_CONTAINER="typst-mcp-smoke-${STACK_ID}"
          IDP_CONTAINER="typst-mcp-smoke-oidc-${STACK_ID}"
          SMOKE_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          BASE="http://localhost:${SMOKE_PORT}"
          SMOKE_DIR="${RUNNER_TEMP}/typst-mcp-smoke-${STACK_ID}"
          mkdir -p "$SMOKE_DIR"
          chmod 700 "$SMOKE_DIR"
          printf '%s\n' "$NETWORK" >"$SMOKE_DIR/network"
          printf '%s\n' "$APP_CONTAINER" >"$SMOKE_DIR/app-container"
          printf '%s\n' "$IDP_CONTAINER" >"$SMOKE_DIR/idp-container"
          printf '%s\n' "$BASE" >"$SMOKE_DIR/base"
          printf '%s\n' "$SMOKE_DIR" >"${RUNNER_TEMP}/typst-mcp-smoke-dir"
          openssl rand -hex 32 >"$SMOKE_DIR/api-key"
          openssl rand -hex 32 >"$SMOKE_DIR/other-api-key"
          openssl rand -hex 32 >"$SMOKE_DIR/tenant-salt"
          openssl rand -hex 32 >"$SMOKE_DIR/signing-secret"
          chmod 600 "$SMOKE_DIR"/*

          docker network create "$NETWORK"
          scripts/prepare-smoke-oidc.sh \
            "$SMOKE_DIR/oidc" "$SMOKE_DIR/token" \
            http://oidc:8999 smoke-api smoke-tenant
          docker run -d --name "$IDP_CONTAINER" \
            --network "$NETWORK" --network-alias oidc \
            --volume "$SMOKE_DIR/oidc:/www:ro" \
            docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0 \
            httpd -f -p 8999 -h /www
          docker run -d --name "$APP_CONTAINER" \
            --network "$NETWORK" \
            --publish "127.0.0.1:${SMOKE_PORT}:3000" \
            --tmpfs /data:uid=65532,gid=65532,mode=0700,size=1g \
            --env TYPST_MCP_PUBLIC_URL="$BASE" \
            --env TYPST_MCP_API_KEYS="smoke:$(cat "$SMOKE_DIR/api-key"),smoke-other:$(cat "$SMOKE_DIR/other-api-key")" \
            --env TYPST_MCP_TENANT_SALT="$(cat "$SMOKE_DIR/tenant-salt")" \
            --env TYPST_MCP_SIGNING_SECRET="$(cat "$SMOKE_DIR/signing-secret")" \
            --env TYPST_MCP_OIDC_ISSUER=http://oidc:8999 \
            --env TYPST_MCP_OIDC_AUDIENCE=smoke-api \
            --env TYPST_MCP_OIDC_TENANT_ID=smoke-tenant \
            --env TYPST_MCP_COMPILE_TIMEOUT=3s \
            --env TYPST_MCP_MAX_CONCURRENT_COMPILES=2 \
            --env TYPST_MCP_WORKER_MEMORY_BYTES=1073741824 \
            typst-mcp:ci
          for _ in $(seq 1 60); do
            curl -fsS "$BASE/health" >/dev/null && exit 0
            sleep 1
          done
          echo "smoke container did not become healthy" >&2
          exit 1
      - name: Smoke exact local image
        run: |
          set -euo pipefail
          SMOKE_DIR="$(cat "${RUNNER_TEMP}/typst-mcp-smoke-dir")"
          BASE="$(cat "$SMOKE_DIR/base")" \
          API_KEY="$(cat "$SMOKE_DIR/api-key")" \
          OTHER_API_KEY="$(cat "$SMOKE_DIR/other-api-key")" \
          MCP_BEARER="$(cat "$SMOKE_DIR/token")" \
          EXPECTED_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" \
          HTTP_TIMEOUT=30 \
          scripts/smoke.sh
      - name: Nightly 10,000-filename soak
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          SMOKE_DIR="$(cat "${RUNNER_TEMP}/typst-mcp-smoke-dir")"
          BASE="$(cat "$SMOKE_DIR/base")" \
          API_KEY="$(cat "$SMOKE_DIR/api-key")" \
          CONTAINER="$(cat "$SMOKE_DIR/app-container")" \
          ITERATIONS=10000 \
          scripts/soak.sh
      - name: Collect smoke logs on failure
        if: failure()
        run: |
          SMOKE_DIR="$(cat "${RUNNER_TEMP}/typst-mcp-smoke-dir" 2>/dev/null || true)"
          if [[ -n "$SMOKE_DIR" && -f "$SMOKE_DIR/app-container" ]]; then
            docker logs "$(cat "$SMOKE_DIR/app-container")" || true
          fi
      - name: Publish exact smoked image (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          V="${GITHUB_REF#refs/tags/}"
          docker tag typst-mcp:ci "forge.oddie.app/jlxq0/typst-mcp:${V}"
          docker tag typst-mcp:ci forge.oddie.app/jlxq0/typst-mcp:latest
          docker push "forge.oddie.app/jlxq0/typst-mcp:${V}"
          docker push forge.oddie.app/jlxq0/typst-mcp:latest
      - name: Tear down smoke stack
        if: always()
        run: |
          SMOKE_DIR="$(cat "${RUNNER_TEMP}/typst-mcp-smoke-dir" 2>/dev/null || true)"
          if [[ -n "$SMOKE_DIR" && -d "$SMOKE_DIR" ]]; then
            docker rm -f \
              "$(cat "$SMOKE_DIR/app-container")" \
              "$(cat "$SMOKE_DIR/idp-container")" || true
            docker network rm "$(cat "$SMOKE_DIR/network")" || true
          fi
