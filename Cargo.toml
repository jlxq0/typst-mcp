[package]
name = "typst-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "MCP server and REST API that renders branded PDFs with Typst"

[dependencies]
# --- Typst, all pinned in lockstep. `cargo tree -p comemo -p tiny-skia`
#     after any bump: those two must match what typst/typst-render resolve to.
typst = "0.15.1"
typst-library = "0.15.1"
# `PagedDocument` / `Page` live here, not in `typst` — `typst::compile::<T>` is
# generic over `Output` and typst-layout is what implements it.
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = [
    "embedded-fonts",
    "scan-fonts",
] }
comemo = "0.5"
tiny-skia = "0.12"

# --- async runtime, for the parent side of the worker protocol ---
tokio = { version = "1.41", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
    "sync",
    "time",
    "signal",
    "net",
    "fs",
] }

# --- serde ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# --- per-compile address-space cap, imposed by the worker on itself ---
rlimit = "0.10"

# --- MCP ---
# 3.x, not the 1.7 the sibling MCP servers pin. The protocol version is set
# explicitly to V_2026_07_28: it is in KNOWN_VERSIONS, but LATEST still points at
# 2025-11-25 upstream (PR #1105). Drop the override when that lands.
rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
futures = "0.3"

# --- HTTP server ---
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
http = "1"
bytes = "1"

# --- logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "trace",
] }

# --- OIDC token validation (Entra) ---
# rustls only: no OpenSSL in the image, and nothing to keep patched.
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- identity, signed URLs, ids ---
# sha2/hmac for tenant derivation and URL signatures; subtle for constant-time
# comparison (a naive == on a secret is a timing oracle); zeroize so a key does not
# linger in freed memory.
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
hex = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
ulid = "1"
url = "2.5"

# --- template manifests + data validation ---
toml = "1.1"
jsonschema = { version = "0.49", default-features = false }
tar = "0.4"
flate2 = "1"

# --- errors ---
anyhow = "1.0"
thiserror = "2.0"
tempfile = "3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "test-util", "time"] }

[profile.release]
panic = "abort"
strip = true
lto = "thin"
