# Kampong Social Club document.
#
# The library is vendored byte-for-byte from OfficeMaster. This manifest and the safe
# fixture are typst-mcp integration metadata; no member handout or screenshot is copied.

name = "ksc"
kind = "wrapper"
version = "1.0.0"
description = """
Kampong Social Club document — cream and ink palette, red marks, Passion One display type, \
Inter body type, roman/alpha heading scheme, and full or simple operator footer. Light and \
dark modes."""
entrypoint = "ksc.typ"
wrapper_fn = "ksc-doc"

[args.title]
arg = "title"
type = "str"

[args.subtitle]
arg = "subtitle"
type = "str"

[args.recipient]
arg = "recipient"
type = "str"

[args.author]
arg = "author"
type = "str"

[args.date]
arg = "date"
type = "date"

[args.theme]
arg = "theme"
type = "ident"
map = { light = "light-theme", dark = "dark-theme" }

[args.footer_style]
arg = "footer-style"
type = "str"

[args.org]
arg = "org"
type = "str"

[args.address]
arg = "address"
type = "strings"

[args.email]
arg = "email"
type = "str"

[args.web]
arg = "web"
type = "str"

[args.social]
arg = "social"
type = "str"

[args.legal]
arg = "legal"
type = "strings"

[args.support]
arg = "support"
type = "str"

[args.confidentiality]
arg = "confidentiality"
type = "str"

[args.contents]
arg = "contents"
type = "bool"
